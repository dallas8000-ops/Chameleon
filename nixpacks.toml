# Nixpacks build for the single Chameleon Railway service.
#
# The API, Celery worker and Celery Beat share one container (see Procfile) because
# a Railway volume can only be mounted on one service, and all three need the same
# private media directory. The image therefore needs FFmpeg for export assembly and
# Node for the frontend bundle the API serves same-origin with /api.

[variables]
NIXPACKS_PYTHON_VERSION = "3.11"
PYTHONUNBUFFERED = "1"

[phases.setup]
nixPkgs = ["python311", "nodejs_20", "ffmpeg", "gcc"]

[phases.install]
# NODE_ENV is deliberately left unset: Vite, React and the TypeScript toolchain are
# devDependencies, and `npm ci` would skip them under NODE_ENV=production.
cmds = [
  "python -m venv --copies /opt/venv",
  "/opt/venv/bin/pip install --upgrade pip",
  "/opt/venv/bin/pip install -r backend/requirements.txt",
  "npm --prefix frontend ci --include=dev",
]

[phases.build]
# Vite writes frontend/dist, which Django's FRONTEND_DIST_DIR default points at.
# collectstatic runs here (not pre-deploy) because STATIC_ROOT is image content;
# the placeholder credentials only satisfy settings import and touch no service.
cmds = [
  "npm --prefix frontend run build",
  "cd backend && SECRET_KEY=collectstatic-build-only-placeholder-value-not-used-at-runtime DATABASE_URL=sqlite:///collectstatic.sqlite3 REDIS_URL=redis://127.0.0.1:6379/0 /opt/venv/bin/python manage.py collectstatic --noinput",
]
